
# No local postgres service. The app talks to Neon via DATABASE_URL, so a
# local server here was never used by any code path.
#
# The backend image has pg_dump, so a backup needs no extra service:
#
#   # 1. dump inside the container (never redirect binary through the shell)
#   docker compose exec -T backend sh -c 'pg_dump "$DATABASE_URL" -Fc -f /tmp/b.dump'
#   # 2. confirm the archive is intact BEFORE trusting the host copy
#   docker compose exec -T backend pg_restore --list /tmp/b.dump | tail -3
#   # 3. copy to the host
#   docker compose cp backend:/tmp/b.dump ./b.dump
#
# PowerShell's ">" mangles binary output and produced a corrupt archive once
# already. Steps 1-3 are the sequence that actually works.
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jobfor_backend
    restart: unless-stopped
    develop:
      watch:
        - path: ./backend
          action: rebuild
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS}
      GROQ_API_KEY: ${GROQ_API_KEY}
      UPLOAD_DIR: ${UPLOAD_DIR}
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
    volumes:
      - ./backend:/app
      - jobfor_uploads:/app/uploads
    ports:
      - "8000:8000"
    networks:
      - jobfor_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: jobfor_frontend
    restart: unless-stopped
    develop:
      watch:
        - path: ./frontend
          action: sync
          target: /app
    environment:
      - VITE_API_BASE_URL=${VITE_API_BASE_URL}
      - VITE_API_MODE=${VITE_API_MODE}
      - VITE_DOCKER=true
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    networks:
      - jobfor_network
    depends_on:
      - backend

volumes:
  jobfor_uploads:
    name: jobfor_uploads

networks:
  jobfor_network:
    name: jobfor_network
    driver: bridge
